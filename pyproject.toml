[project]
name = "terminal-linux"
version = "0.3.0"
description = "A Linux desktop for AI agents, live in your terminal."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "byte4day", email = "byte4day@users.noreply.github.com" }]
dependencies = [
    "mcp>=1.9.0,<2",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/byte4day/terminal-linux"
Repository = "https://github.com/byte4day/terminal-linux"

[project.scripts]
terminal-linux = "terminal_linux.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
